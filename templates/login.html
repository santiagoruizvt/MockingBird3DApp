{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <h2>Iniciar Sesión</h2>
    <form method="POST">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" name="action" value="login">Entrar</button>
        <button class="btn btn-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#registerForm">Crear cuenta</button>
      </div>
    </form>

    <div class="collapse mt-3" id="registerForm">
      <h3>Crear Cuenta</h3>
      <form method="POST">
        <div class="mb-3">
          <label>Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Contraseña</label>
          <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
          <label>Confirmar contraseña</label>
          <input type="password" name="confirm_password" class="form-control" required minlength="6">
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-success" name="action" value="register">Crear cuenta</button>
          <button class="btn btn-link" type="button" data-bs-toggle="collapse" data-bs-target="#registerForm">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
